name: Build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ make
      - name: Build
        run: make all
      - name: Run tests
        run: sudo apt-get install -y libgtest-dev && make test